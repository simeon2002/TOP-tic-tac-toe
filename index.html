<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="game-container">
      <div class="start-container hidden">
        <h1 class="heading-primary">Welcome to TicTacToe!</h1>
        <p class="start-desc">Whenever you are ready to start a game, click on 'play round' and you'll get started right away!</p>
        <button class="btn btn--play">Play Round</button>
      </div>
      <div class="play-container">
        <div class="player-scores">
          <div class="player-card">
            <h2 class="player-card__name heading-secondary">Player 1: <span class="player-name">Simeon</span></h2>
            <p class="player-card__score"><span class="label">Score:</span> 1</p>
          </div>
          <div class="player-card player-card--active">
            <h2 class="player-card__name heading-secondary">Player 2: <span class="player-name">Darina</span></h2>
            <p class="player-card__score"><span class="label">Score:</span> 1</p>
          </div>
        </div>
        <div class="grid grid--game">
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
          <div class="btn--grid"></div>
        </div>
      </div>
    </div>
  </body>
</html>
